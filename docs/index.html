    <!-- GitHub Pages Single Page App routing restoration for custom domains (e.g. golfcrater.com/category/crypto-account) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Trailing slash normalizer for GitHub Pages subfolder hosting -->
    <script>
      (function() {
        var loc = window.location;
        // If on github.io or subpath without trailing slash and without a file extension
        if (loc.hostname.indexOf('github.io') !== -1) {
          var path = loc.pathname;
          var lastSegment = path.split('/').filter(Boolean).pop() || '';
          if (lastSegment && lastSegment.indexOf('.') === -1 && !path.endsWith('/')) {
            loc.replace(path + '/' + loc.search + loc.hash);
          }
        }
      })();
    </script>
