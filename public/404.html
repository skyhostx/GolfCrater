<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GolfCrater | Verified Digital Marketplace</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script (supports custom domain golfcrater.com & github.io)
      var isGithubSubfolder = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGithubSubfolder ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
