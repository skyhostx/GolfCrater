<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph / Facebook / LinkedIn -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Discover verified digital products, aged business accounts, reputation management, and high-deliverability SMTP services." />

    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://golfcrater.com/#website",
          "url": "https://golfcrater.com/",
          "name": "GolfCrater",
          "description": "Verified Digital Marketplace & Professional Business Services",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://golfcrater.com/shop?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://golfcrater.com/#organization",
          "name": "GolfCrater",
          "url": "https://golfcrater.com/",
          "logo": "https://golfcrater.com/assets/favicon.ico",
          "description": "Premium Digital Marketplace for verified digital services, business accounts, reputation management, and online professional solutions.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "availableLanguage": ["English"]
          }
        }
      ]
    }
    </script>

    <!-- GitHub Pages Single Page App routing restoration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
            basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" media="print" onload="this.media='all'">

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">

  <body class="bg-white text-slate-900 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900">

        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: #10b981; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #ffffff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);">
            ✓
          </div>
          <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a;">Golf<span style="color: #10b981;">Crater</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: gc-pulse 1.2s ease-in-out infinite;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: gc-pulse 1.2s ease-in-out 0.2s infinite;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: gc-pulse 1.2s ease-in-out 0.4s infinite;"></div>
        </div>
        <style>
          @keyframes gc-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
